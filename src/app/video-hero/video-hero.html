<section class="video-hero" aria-label="Componente de video principal">
  <div class="video-hero__frame">
    <div class="video-hero__media">
      <video
        #heroVideo
        class="video-hero__video"
        src="media/video.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        aria-label="Video de abertura do museu"
      ></video>
      <div class="video-hero__veil"></div>
      <div class="video-hero__grain" aria-hidden="true"></div>
    </div>
    <img class="video-hero__logo" src="logo12.svg" alt="Museu do Tribunal de Justica de Sao Paulo" />
    <h1 class="video-hero__title">BEM VINDOS AO MUSEU DO TRIBUNAL DE JUSTICA DE SAO PAULO</h1>
  </div>
</section>
